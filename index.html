<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Tap Seed - v12.3 Final Fixes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      /* --- GENEL AYARLAR --- */
      :root {
        --primary: #3f2e22;
      }
      body {
        font-family: "Inter", sans-serif;
        overflow: hidden;
        color: white;
        background-image: url("assets/bac.png");
        background-size: cover;
        background-position: center;
        transition: filter 2s ease-in-out, background-color 2s ease-in-out;
      }

      /* --- GECE MODU EFEKTİ --- */
      body.night-mode {
        filter: brightness(0.6) contrast(1.1) hue-rotate(-10deg);
      }
      body.night-mode .big-score-text {
        text-shadow: 0 0 30px rgba(255, 255, 255, 0.8);
      }

      /* --- UI NESNELERİ --- */
      .top-icon-btn {
        width: 150px;
        height: 150px;
        transition: transform 0.2s;
        cursor: pointer;
        filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.5));
        object-fit: contain;
      }
      .top-icon-btn:hover {
        transform: scale(1.1) rotate(10deg);
      }
      .top-icon-btn:active {
        transform: scale(0.9);
      }

      .game-logo {
        position: absolute;
        top: 20px;
        left: 1px;
        width: 90px;
        z-index: 60;
        filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.5));
        object-fit: contain;
      }

      .shop-item-btn {
        background-color: rgba(255, 255, 255, 0.9);
        border: 2px solid rgba(255, 255, 255, 0.5);
        border-radius: 10px;
        padding: 0.5rem 1rem;
        color: #1a1a1a;
        display: flex;
        align-items: center;
        justify-content: space-between;
        transition: all 0.1s;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        width: 100%;
        height: 65px;
        flex-shrink: 0;
      }
      .shop-item-btn:hover:not(:disabled) {
        transform: translateX(-5px);
        background-color: white;
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
      }
      .shop-item-btn:active:not(:disabled) {
        transform: scale(0.98);
      }
      .shop-item-btn:disabled {
        opacity: 0.6;
        filter: grayscale(1);
        cursor: not-allowed;
        background-color: rgba(200, 200, 200, 0.5);
      }

      .level-panel {
        background-color: rgba(0, 0, 0, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(4px);
        border-radius: 16px;
        padding: 0.8rem;
        width: 100%;
        max-width: 400px;
        margin-top: 0.5rem;
        text-align: center;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
      }

      .rain-drop {
        position: absolute;
        background: #a0c4ff;
        width: 2px;
        height: 15px;
        animation: rainFall 0.7s linear infinite;
        z-index: 10;
      }
      @keyframes rainFall {
        to {
          transform: translateY(100vh);
        }
      }

      @keyframes sway {
        0%,
        100% {
          transform: rotate(0deg);
        }
        25% {
          transform: rotate(1deg);
        }
        75% {
          transform: rotate(-1deg);
        }
      }
      .plant-idle {
        animation: sway 5s ease-in-out infinite;
        transform-origin: bottom center;
        transition: transform 0.1s;
        margin-top: 90px;
      }
      .plant-pressed {
        transform: scale(0.9) !important;
      }

      #plant-score-wrapper {
        position: absolute;
        top: 15%;
        left: 50%;
        transform: translateX(-50%);
        z-index: 60;
        text-align: center;
        pointer-events: none;
        width: 100%;
      }

      .big-score-text {
        font-size: 4rem;
        font-weight: 900;
        color: white;
        text-shadow: 0 4px 0 #3f2e22, 0 0 20px rgba(255, 255, 255, 0.5);
        line-height: 1;
        animation: float-gentle 3s ease-in-out infinite;
        transition: text-shadow 2s;
      }
      .sp-label {
        font-size: 1.5rem;
        font-weight: 700;
        color: #fef08a;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
      }
      .score-pop {
        animation: scorePopAnim 0.15s ease-out forwards;
      }
      @keyframes scorePopAnim {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.2);
          color: #facc15;
        }
        100% {
          transform: scale(1);
        }
      }
      @keyframes float-gentle {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }

      .floating-text {
        position: absolute;
        font-weight: 900;
        pointer-events: none;
        animation: floatUp 0.8s cubic-bezier(0, 0.9, 0.57, 1) forwards;
        color: #fff;
        text-shadow: 0 2px 0 #000;
        z-index: 70;
        font-size: 2rem;
      }
      @keyframes floatUp {
        0% {
          opacity: 1;
          transform: translateY(0) scale(0.5);
        }
        50% {
          transform: scale(1.2);
        }
        100% {
          opacity: 0;
          transform: translateY(-100px) scale(1);
        }
      }

      .progress-container {
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      .modal-bg {
        background-color: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(8px);
      }

      .glass-stat {
        background-color: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(8px);
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 0.5rem;
      }

      .achievement-item {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 10px;
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
        opacity: 0.5;
        filter: grayscale(1);
        transition: 0.3s;
      }
      .achievement-item.unlocked {
        opacity: 1;
        filter: grayscale(0);
        background: rgba(255, 215, 0, 0.2);
        border: 1px solid rgba(255, 215, 0, 0.5);
      }

      .name-input {
        background: rgba(255, 255, 255, 0.9);
        border: 2px solid #3f2e22;
        padding: 10px 20px;
        border-radius: 30px;
        font-size: 1.2rem;
        color: #3f2e22;
        font-weight: bold;
        text-align: center;
        outline: none;
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
        margin-bottom: 20px;
        width: 250px;
      }
      .name-input::placeholder {
        color: #888;
      }

      #golden-seed {
        /* DÜZELTME: Z-Index 100 yapıldı, artık her şeyin üstünde */
        z-index: 100;
      }
      #golden-seed-img {
        width: 80px;
        height: 80px;
        object-fit: contain;
        filter: drop-shadow(0 0 15px gold);
        animation: spin-slow 10s linear infinite;
        cursor: pointer;
      }
      @keyframes spin-slow {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 1024px) {
        body {
          flex-direction: column;
          overflow-y: auto;
        }
        #left-zone {
          height: auto;
          min-height: 60vh;
          width: 100%;
          padding-top: 60px;
        }
        #right-zone {
          width: 100%;
          height: auto;
          min-height: 50vh;
        }
        .game-logo {
          width: 90px;
        }
      }

      .close-btn {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 30px;
        height: 30px;
        background: red;
        color: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-weight: bold;
      }

      .bee-moving {
        position: absolute;
        z-index: 55;
        cursor: pointer;
        /* DÜZELTME: Animasyon süresi 20sn yapıldı */
        animation: beeFly 20s linear forwards;
        filter: drop-shadow(0 0 10px rgba(255, 255, 0, 0.5));
      }

      /* DÜZELTME: Arı artık SAĞDAN sola doğru uçuyor */
      @keyframes beeFly {
        0% {
          left: 110%; /* Sağdan başla */
          transform: translateY(0) scaleX(1);
        }
        25% {
          transform: translateY(-50px) scaleX(1);
        }
        50% {
          transform: translateY(50px) scaleX(1);
        }
        100% {
          left: -150px; /* Soldan çık */
          transform: translateY(0) scaleX(1);
        }
      }
    </style>
  </head>

  <body class="flex h-screen w-full relative">
    <div
      id="rain-layer"
      class="absolute inset-0 pointer-events-none z-10"
    ></div>

    <img
      src="assets/logo- tap seed.png"
      class="game-logo"
      alt="Tap Seed Logo"
    />

    <div class="absolute -top-8 right-5 z-[80] flex w-50 h-50">
      <img
        src="assets/basarimlar.png"
        onclick="game.toggleAchievements()"
        class="top-icon-btn"
        title="Başarımlar"
        style="z-index: 2"
      />
      <img
        src="assets/cark.png"
        onclick="game.toggleSettings()"
        class="top-icon-btn -ml-8"
        title="Ayarlar"
        style="z-index: 1"
      />
    </div>

    <section
      id="left-zone"
      class="w-full lg:w-3/5 h-full relative flex flex-col items-center justify-center select-none z-40 p-4"
    >
      <div
        id="golden-seed"
        onclick="game.catchGoldenSeed(); event.stopPropagation();"
        class="hidden absolute hover:scale-110 transition"
      >
        <img id="golden-seed-img" src="assets/yıldız.png" alt="Bonus" />
      </div>

      <div id="plant-score-wrapper">
        <div id="big-plant-score" class="big-score-text">0</div>
        <span class="sp-label">SP</span>
      </div>

      <div
        id="click-area"
        onclick="game.handleClick(event)"
        class="relative w-[400px] h-[400px] z-40 flex items-center justify-center cursor-pointer group mt-8"
      >
        <img
          id="plant-img"
          src="assets/level1.png"
          class="plant-idle w-full h-full object-contain drop-shadow-2xl group-hover:scale-105 transition-transform"
        />
      </div>

      <div class="level-panel">
        <div class="flex justify-between items-end mb-2">
          <div>
            <h2
              data-i18n="level_label"
              class="text-[10px] font-bold opacity-70 tracking-widest uppercase mb-1 text-yellow-100 text-left"
            >
              SEVİYE
            </h2>
            <h1
              id="level-name"
              class="text-2xl font-black leading-none text-white drop-shadow-md text-left"
            >
              TOHUM
            </h1>
          </div>
          <div class="text-right">
            <div class="text-[10px] bg-white/20 px-2 py-1 rounded mb-1">
              <span data-i18n="size_label">Boyut:</span>
              <span id="dim-display" class="font-bold text-yellow-300">1</span>
            </div>
            <div class="text-[10px] font-bold opacity-80 text-yellow-100">
              <span data-i18n="target_label">Hedef:</span>
              <span id="next-level-req">100</span>
            </div>
          </div>
        </div>
        <div
          class="progress-container h-3 rounded-full overflow-hidden relative w-full"
        >
          <div
            id="level-bar"
            class="h-full bg-gradient-to-r from-green-500 to-yellow-400 transition-all duration-300"
            style="width: 0%"
          ></div>
        </div>
      </div>
    </section>

    <section
      id="right-zone"
      class="w-full lg:w-2/5 h-full p-4 lg:p-6 relative z-40 flex flex-col pointer-events-none bg-black/20 backdrop-blur-sm"
    >
      <div
        class="pointer-events-auto w-full h-full flex flex-col gap-3 overflow-y-auto mt-10 pt-16 lg:pt-4"
      >
        <div class="grid grid-cols-2 gap-3 shrink-0">
          <div class="glass-stat flex flex-col items-center">
            <div
              data-i18n="total_earnings"
              class="text-[10px] text-white/80 font-bold uppercase"
            >
              Toplam Kazanç
            </div>
            <div class="text-xl font-black text-yellow-300" id="lifetime-score">
              0
            </div>
          </div>
          <div class="glass-stat flex flex-col items-center">
            <div
              data-i18n="total_clicks"
              class="text-[10px] text-white/80 font-bold uppercase"
            >
              Toplam Tık
            </div>
            <div class="text-xl font-black text-white" id="total-clicks">0</div>
          </div>
        </div>
        <div
          class="text-center text-xs text-lime-300 font-bold bg-black/30 p-1 rounded"
        >
          +<span id="sps-display">0.0</span> SP / Saniye
        </div>

        <h3
          data-i18n="market_title"
          class="text-white font-black text-xl mt-2 drop-shadow-md shrink-0 border-b border-white/20 pb-1"
        >
          MARKET
        </h3>

        <div class="flex flex-col gap-2 pb-20">
          <button
            id="btn-click"
            onclick="game.buyUpgrade('click')"
            class="shop-item-btn group"
          >
            <div class="flex items-center gap-3">
              <div class="text-2xl filter drop-shadow">☀️</div>
              <div class="text-left leading-tight">
                <div class="font-black text-sm" data-i18n="upg_click">
                  Güneş Işığı
                </div>
                <div class="text-[10px] text-gray-500 font-bold" id="lvl-click">
                  Lvl 1
                </div>
              </div>
            </div>
            <div class="text-right leading-tight">
              <div class="font-black text-sm" id="cost-click">50 SP</div>
              <div
                class="text-[10px] text-gray-600 font-bold"
                data-i18n="bonus_click"
              >
                +1 Tık
              </div>
            </div>
          </button>

          <button
            id="btn-water"
            onclick="game.buyUpgrade('water')"
            class="shop-item-btn group"
          >
            <div class="flex items-center gap-3">
              <div class="text-2xl filter drop-shadow">💧</div>
              <div class="text-left leading-tight">
                <div class="font-black text-sm" data-i18n="upg_water">
                  Can Suyu
                </div>
                <div class="text-[10px] text-gray-500 font-bold" id="lvl-water">
                  Lvl 0
                </div>
              </div>
            </div>
            <div class="text-right leading-tight">
              <div class="font-black text-sm" id="cost-water">100 SP</div>
              <div
                class="text-[10px] text-gray-600 font-bold"
                data-i18n="bonus_water"
              >
                +2 Tık
              </div>
            </div>
          </button>

          <button
            id="btn-auto"
            onclick="game.buyUpgrade('auto')"
            class="shop-item-btn group"
          >
            <div class="flex items-center gap-3">
              <div class="text-2xl filter drop-shadow">💩</div>
              <div class="text-left leading-tight">
                <div class="font-black text-sm" data-i18n="upg_auto">
                  Doğal Gübre
                </div>
                <div class="text-[10px] text-gray-500 font-bold" id="lvl-auto">
                  Lvl 0
                </div>
              </div>
            </div>
            <div class="text-right leading-tight">
              <div class="font-black text-sm" id="cost-auto">15 SP</div>
              <div
                class="text-[10px] text-gray-600 font-bold"
                data-i18n="bonus_auto"
              >
                +1.0 Oto
              </div>
            </div>
          </button>

          <button
            id="btn-shears"
            onclick="game.buyUpgrade('shears')"
            class="shop-item-btn group"
          >
            <div class="flex items-center gap-3">
              <div class="text-2xl filter drop-shadow">✂️</div>
              <div class="text-left leading-tight">
                <div class="font-black text-sm" data-i18n="upg_shears">
                  Budama
                </div>
                <div
                  class="text-[10px] text-gray-500 font-bold"
                  id="lvl-shears"
                >
                  Lvl 0
                </div>
              </div>
            </div>
            <div class="text-right leading-tight">
              <div class="font-black text-sm" id="cost-shears">250 SP</div>
              <div
                class="text-[10px] text-gray-600 font-bold"
                data-i18n="bonus_shears"
              >
                +5.0 Oto
              </div>
            </div>
          </button>

          <button
            id="btn-gloves"
            onclick="game.buyUpgrade('gloves')"
            class="shop-item-btn group"
          >
            <div class="flex items-center gap-3">
              <div class="text-2xl filter drop-shadow">🧤</div>
              <div class="text-left leading-tight">
                <div class="font-black text-sm" data-i18n="upg_gloves">
                  Eldiven
                </div>
                <div
                  class="text-[10px] text-gray-500 font-bold"
                  id="lvl-gloves"
                >
                  Lvl 0
                </div>
              </div>
            </div>
            <div class="text-right leading-tight">
              <div class="font-black text-sm" id="cost-gloves">1000 SP</div>
              <div
                class="text-[10px] text-gray-600 font-bold"
                data-i18n="bonus_gloves"
              >
                +10 Tık
              </div>
            </div>
          </button>

          <button
            id="btn-med"
            onclick="game.buyUpgrade('med')"
            class="shop-item-btn group"
          >
            <div class="flex items-center gap-3">
              <div class="text-2xl filter drop-shadow">🧪</div>
              <div class="text-left leading-tight">
                <div class="font-black text-sm" data-i18n="upg_med">
                  Vitamin
                </div>
                <div class="text-[10px] text-gray-500 font-bold" id="lvl-med">
                  Lvl 0
                </div>
              </div>
            </div>
            <div class="text-right leading-tight">
              <div class="font-black text-sm" id="cost-med">5000 SP</div>
              <div
                class="text-[10px] text-gray-600 font-bold"
                data-i18n="bonus_med"
              >
                +25.0 Oto
              </div>
            </div>
          </button>

          <button
            id="btn-ladybug"
            onclick="game.buyUpgrade('boost')"
            class="shop-item-btn group"
          >
            <div class="flex items-center gap-3">
              <div
                class="text-2xl filter drop-shadow group-hover:rotate-12 transition"
              >
                🐞
              </div>
              <div class="text-left leading-tight">
                <div class="font-black text-sm" data-i18n="upg_boost">
                  Uğur Böceği
                </div>
                <div
                  class="text-[10px] text-red-600 font-bold"
                  data-i18n="bonus_boost"
                >
                  Hız x2 (60sn)
                </div>
              </div>
            </div>
            <div class="flex flex-col items-end leading-tight">
              <div
                id="boost-status-container"
                class="h-5 flex items-center"
              ></div>
              <div class="font-black text-sm" id="cost-boost">500 SP</div>
            </div>
          </button>

          <button
            id="btn-prestige"
            onclick="game.prestige()"
            class="hidden shop-item-btn !bg-gradient-to-r from-yellow-100 to-yellow-200 !border-yellow-400"
          >
            <div class="flex items-center gap-3">
              <img src="assets/kupa.png" class="w-8 h-8 object-contain" />
              <div class="text-left leading-tight">
                <div
                  class="font-black text-sm text-yellow-800"
                  data-i18n="prestige_title"
                >
                  PRESTİJ
                </div>
                <div
                  class="text-[10px] text-yellow-700 font-bold"
                  data-i18n="prestige_desc"
                >
                  Boyut Atla
                </div>
              </div>
            </div>
            <div
              class="text-right font-black text-yellow-900 text-xs"
              data-i18n="prestige_power"
            >
              %50 GÜÇ
            </div>
          </button>
        </div>
      </div>
    </section>

    <div
      id="achievements-modal"
      class="hidden fixed inset-0 modal-bg z-[100] flex items-center justify-center p-4"
    >
      <div
        class="bg-[#3f2e22] border-4 border-[#5d4037] rounded-2xl w-full max-w-lg max-h-[80vh] overflow-y-auto relative p-6 text-white shadow-2xl"
      >
        <div onclick="game.toggleAchievements()" class="close-btn">X</div>
        <h2
          data-i18n="achievements"
          class="text-2xl font-black mb-4 text-center text-yellow-400"
        >
          BAŞARIMLAR
        </h2>
        <div id="achievements-list" class="space-y-2"></div>
      </div>
    </div>

    <div
      id="settings-modal"
      class="hidden fixed inset-0 modal-bg z-[100] flex items-center justify-center"
    >
      <div
        class="bg-[#3f2e22] border-4 border-[#5d4037] rounded-2xl w-80 relative text-center shadow-2xl p-6"
      >
        <div onclick="game.toggleSettings()" class="close-btn">X</div>
        <h3 data-i18n="settings" class="font-bold text-xl mb-6 text-white">
          AYARLAR
        </h3>

        <div class="flex flex-col gap-4 items-center w-full">
          <div class="flex gap-2 justify-center w-full flex-wrap">
            <button
              onclick="setLanguage('tr')"
              class="px-3 py-2 bg-red-600 rounded text-xs font-bold hover:scale-110 transition shadow text-white"
            >
              TR
            </button>
            <button
              onclick="setLanguage('en')"
              class="px-3 py-2 bg-blue-600 rounded text-xs font-bold hover:scale-110 transition shadow text-white"
            >
              EN
            </button>
            <button
              onclick="setLanguage('de')"
              class="px-3 py-2 bg-yellow-500 rounded text-xs font-bold hover:scale-110 transition shadow text-white"
            >
              DE
            </button>
            <button
              onclick="setLanguage('es')"
              class="px-3 py-2 bg-orange-500 rounded text-xs font-bold hover:scale-110 transition shadow text-white"
            >
              ES
            </button>
            <button
              onclick="setLanguage('it')"
              class="px-3 py-2 bg-green-600 rounded text-xs font-bold hover:scale-110 transition shadow text-white"
            >
              IT
            </button>
          </div>

          <button
            onclick="audioManager.toggle()"
            class="w-16 h-16 rounded-full shadow-lg transition hover:scale-110 bg-white/10 flex items-center justify-center"
          >
            <img
              id="sound-icon-img"
              src="assets/ses-ac.png"
              class="w-10 h-10 object-contain"
            />
          </button>
          <div data-i18n="sound_status" class="text-xs text-white opacity-70">
            Ses Durumu
          </div>

          <button
            onclick="game.toggleInfo()"
            data-i18n="how_to_play"
            class="p-3 bg-blue-600 text-white rounded-xl hover:bg-blue-700 font-bold transition w-full"
          >
            NASIL OYNANIR?
          </button>
          <hr class="my-2 w-full border-white/10" />
          <button
            onclick="game.resetSave()"
            data-i18n="reset"
            class="p-3 bg-red-800/80 text-white border border-red-600 rounded-xl hover:bg-red-900 font-bold transition w-full"
          >
            SIFIRLA
          </button>
        </div>
      </div>
    </div>

    <div
      id="info-modal"
      class="hidden fixed inset-0 modal-bg z-[110] flex items-center justify-center p-4"
    >
      <div
        class="bg-[#3f2e22] border-4 border-[#5d4037] rounded-2xl w-full max-w-md p-6 text-white relative"
      >
        <div onclick="game.toggleInfo()" class="close-btn">X</div>
        <h2 data-i18n="guide" class="font-bold text-xl mb-4">REHBER</h2>
        <p data-i18n="guide_text" class="text-sm opacity-80">
          Toprağa tıkla, tohumları büyüt. Space tuşuna basılı tutarak seri
          tıklayabilirsin!
        </p>
      </div>
    </div>

    <div
      id="start-screen"
      class="fixed inset-0 bg-slate-900 z-[9999] flex flex-col items-center justify-center text-white transition-opacity duration-500"
      style="background-image: url('assets/bac.png'); background-size: cover"
    >
      <div class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>
      <div class="relative z-10 flex flex-col items-center">
        <img
          src="assets/logo- tap seed.png"
          class="w-64 md:w-80 object-contain mb-6 drop-shadow-2xl"
        />
        <input
          type="text"
          id="username-input"
          class="name-input"
          data-i18n="username_placeholder"
          placeholder="İsmini Yaz..."
          maxlength="12"
        />
        <button
          onclick="game.startGame()"
          data-i18n="start_game"
          class="px-16 py-5 text-xl font-black text-[#3f2e22] bg-white rounded-full tracking-wider hover:scale-105 transition shadow-xl border-4 border-[#3f2e22]"
        >
          OYUNA BAŞLA
        </button>
        <div class="mt-8 text-white/50 text-xs font-mono">
          v12.1 - Bee Update
        </div>
      </div>
    </div>

    <div id="toast-container" class="fixed top-24 right-5 z-[90]"></div>

    <script src="lang.js"></script>

    <script>
      /* --- SPACE TUŞU VE EVENTS (GAME LOOP MANTIĞI) --- */

      // Artık Interval kullanmıyoruz, Loop içinde kontrol edeceğiz
      window.addEventListener("keydown", (e) => {
        if (e.code === "Space" && game.gameStarted) {
          e.preventDefault(); // Sayfa kaymasını engeller
          if (!e.repeat) {
            game.isSpaceDown = true; // Bayrağı kaldır
            game.handleClick(null); // İlk dokunuşta hemen tıkla
            const plant = document.getElementById("plant-img");
            if (plant) plant.classList.add("plant-pressed");
          }
        }
      });

      window.addEventListener("keyup", (e) => {
        if (e.code === "Space") {
          game.isSpaceDown = false; // Bayrağı indir
          const plant = document.getElementById("plant-img");
          if (plant) plant.classList.remove("plant-pressed");
        }
      });

      const audioManager = {
        ctx: null,
        enabled: true,
        init() {
          if (!this.ctx)
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        },
        resume() {
          if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
        },
        playPop() {
          if (!this.enabled) return;
          try {
            this.init();
            this.resume();
            const o = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            // Ses frekansını biraz değiştirdim, seri tıklamada kulak tırmalamasın
            o.frequency.setValueAtTime(
              200 + Math.random() * 50,
              this.ctx.currentTime
            );
            g.gain.setValueAtTime(0.05, this.ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(
              0.001,
              this.ctx.currentTime + 0.08 // Daha kısa sürede sussun
            );
            o.connect(g);
            g.connect(this.ctx.destination);
            o.start();
            o.stop(this.ctx.currentTime + 0.08);
          } catch (e) {}
        },
        playDing() {
          if (!this.enabled) return;
          try {
            this.init();
            this.resume();
            const o = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            o.type = "sine";
            o.frequency.setValueAtTime(800, this.ctx.currentTime);
            g.gain.setValueAtTime(0.05, this.ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(
              0.001,
              this.ctx.currentTime + 0.5
            );
            o.connect(g);
            g.connect(this.ctx.destination);
            o.start();
            o.stop(this.ctx.currentTime + 0.5);
          } catch (e) {}
        },
        toggle() {
          this.enabled = !this.enabled;
          document.getElementById("sound-icon-img").src = this.enabled
            ? "assets/ses-ac.png"
            : "assets/ses-kapa.png";
        },
      };

      const game = {
        saveKey: "tapSeed_v12_Lifetime",
        data: {
          username: "",
          points: 0,
          lifetimePoints: 0,
          clickCount: 0,
          clickPower: 1,
          autoPower: 0,
          prestigeMultiplier: 1,
          stage: 0,
          dimension: 1,
          boostEndTime: 0,
          lastSaveTime: Date.now(),
          upgrades: {
            click: { c: 0, b: 50 },
            water: { c: 0, b: 100 },
            auto: { c: 0, b: 15 },
            shears: { c: 0, b: 250 },
            gloves: { c: 0, b: 1000 },
            med: { c: 0, b: 5000 },
            boost: { c: 0, b: 500 },
          },
          unlockedAchievements: [],
        },

        lastFrameTime: 0,
        _accAuto: 0,
        _autoClickAnimTime: 0,

        // SPACE İÇİN YENİ DEĞİŞKENLER
        isSpaceDown: false,
        spaceTimer: 0,

        achievements: [
          {
            id: 1,
            title: "ach_1_title",
            desc: "ach_1_desc",
            cond: (d) => d.clickCount >= 1,
          },
          {
            id: 2,
            title: "ach_2_title",
            desc: "ach_2_desc",
            cond: (d) => d.clickCount >= 500,
          },
          {
            id: 3,
            title: "ach_3_title",
            desc: "ach_3_desc",
            cond: (d) => d.upgrades.auto.c >= 5,
          },
          {
            id: 4,
            title: "ach_4_title",
            desc: "ach_4_desc",
            cond: (d) => d.points >= 10000,
          },
          {
            id: 5,
            title: "ach_5_title",
            desc: "ach_5_desc",
            cond: (d) => d.dimension >= 2,
          },
        ],
        stages: [
          { name: "stage_0", limit: 500, img: "assets/level1.png" },
          { name: "stage_1", limit: 3000, img: "assets/level2.png" },
          { name: "stage_2", limit: 15000, img: "assets/level3.png" },
          { name: "stage_3", limit: 75000, img: "assets/level4.png" },
          { name: "stage_4", limit: 300000, img: "assets/level5.png" },
          { name: "stage_5", limit: 1000000, img: "assets/level6.png" },
          { name: "stage_6", limit: 5000000, img: "assets/level7.png" },
          { name: "stage_7", limit: 25000000, img: "assets/level8.png" },
          { name: "stage_8", limit: 100000000, img: "assets/level9.png" },
          { name: "stage_9", limit: 500000000, img: "assets/level10.png" },
          { name: "stage_10", limit: 2500000000, img: "assets/level11.png" },
          { name: "stage_11", limit: 10000000000, img: "assets/level12.png" },
          { name: "stage_12", limit: 100000000000, img: "assets/level13.png" },
          { name: "stage_13", limit: 500000000000, img: "assets/level14.png" },
          { name: "stage_14", limit: 2000000000000, img: "assets/level15.png" },
        ],
        isRaining: false,
        isNight: false,
        gameStarted: false,

        init() {
          this.load();
          if (typeof updateUITexts === "function") updateUITexts();
          this.recalculateStats();

          if (typeof this.data.lifetimePoints === "undefined") {
            this.data.lifetimePoints = this.data.points;
          }

          if (this.data.username) {
            document.getElementById("username-input").value =
              this.data.username;
          }
          this.updateUI();
          this.renderPlant();
        },
        recalculateStats() {
          this.data.clickPower = 1;
          this.data.autoPower = 0;

          if (this.data.upgrades.click)
            this.data.clickPower += this.data.upgrades.click.c * 1;
          if (this.data.upgrades.water)
            this.data.clickPower += this.data.upgrades.water.c * 2;
          if (this.data.upgrades.gloves)
            this.data.clickPower += this.data.upgrades.gloves.c * 10;

          if (this.data.upgrades.auto)
            this.data.autoPower += this.data.upgrades.auto.c * 1.0;
          if (this.data.upgrades.shears)
            this.data.autoPower += this.data.upgrades.shears.c * 5.0;
          if (this.data.upgrades.med)
            this.data.autoPower += this.data.upgrades.med.c * 25.0;
        },
        startGame() {
          if (this.gameStarted) return;
          const input = document.getElementById("username-input");
          const name = input.value.trim();
          if (!name) {
            alert("Lütfen bir isim gir!");
            return;
          }
          this.data.username = name;
          this.save();

          this.gameStarted = true;
          this.lastFrameTime = Date.now();

          document.getElementById("start-screen").classList.add("hidden");
          setTimeout(
            () => document.getElementById("start-screen").remove(),
            600
          );

          audioManager.init();
          audioManager.resume();
          this.checkOfflineEarnings();
          setInterval(() => this.weatherLoop(), 15000);
          setInterval(() => this.toggleNightMode(), 180000);

          // YEDEK SAYAÇ (Auto-Click için)
          setInterval(() => {
            if (this.gameStarted && this.data.autoPower > 0) {
              const gain = this.data.autoPower * 0.1;
              this.data.points += gain;
              this.data.lifetimePoints += gain;
              this.updateUI();
              this.checkGrowth();
            }
          }, 100);

          this.scheduleGoldenSeed();
          this.scheduleBee();
          requestAnimationFrame(() => this.loop());
          this.showToast(t("welcome") + " " + name, t("good_luck"), "success");
        },
        handleClick(e, isAuto = false) {
          let m = this.data.prestigeMultiplier;
          if (this.isNight) m *= 0.5;
          if (Date.now() < this.data.boostEndTime) m *= 2;
          if (this.isRaining) m *= 2;
          let gain = this.data.clickPower * m;

          this.data.points += gain;
          this.data.lifetimePoints += gain;
          this.data.clickCount++;

          if (!isAuto) {
            audioManager.playPop();
            const clickArea = document.getElementById("click-area");
            let animEvent = e;
            // Space ile basıldıysa veya otoysa rastgele konum
            if (!animEvent && clickArea) {
              const rect = clickArea.getBoundingClientRect();
              animEvent = {
                clientX: rect.left + rect.width / 2 + (Math.random() * 40 - 20),
                clientY: rect.top + rect.height / 2 + (Math.random() * 40 - 20),
              };
            }
            if (animEvent)
              this.createFloatingText(animEvent, `+${Math.floor(gain)}`);
            this.triggerScoreAnim();
          }

          this.checkGrowth();
          this.checkAchievements();
          this.updateUI();
        },
        triggerScoreAnim() {
          const el = document.getElementById("big-plant-score");
          el.classList.remove("score-pop");
          void el.offsetWidth;
          el.classList.add("score-pop");
        },
        loop() {
          if (!this.gameStarted) return;

          const now = Date.now();
          const dt = (now - this.lastFrameTime) / 1000;
          this.lastFrameTime = now;

          // --- SPACE TUŞU SERİ TIKLAMA KONTROLÜ ---
          // Eğer Space basılıysa:
          if (this.isSpaceDown) {
            this.spaceTimer += dt;
            // 0.05 saniyede bir tıkla (Saniyede 20 tıklama)
            if (this.spaceTimer >= 0.05) {
              this.spaceTimer = 0;
              this.handleClick(null); // Tıklama fonksiyonunu çağır

              // Görsel efekt: Bitkiyi titret
              const plant = document.getElementById("plant-img");
              if (plant) {
                plant.classList.add("plant-pressed");
                setTimeout(() => plant.classList.remove("plant-pressed"), 30);
              }
            }
          }
          // ----------------------------------------

          if (typeof this._accAuto === "undefined") this._accAuto = 0;

          if (this.data.autoPower > 0) {
            let m = this.data.prestigeMultiplier;
            if (this.isNight) m *= 3.0;
            if (now < this.data.boostEndTime) m *= 2;
            if (this.isRaining) m *= 2;

            const autoGain = this.data.autoPower * m * dt;

            this.data.points += autoGain;
            this.data.lifetimePoints += autoGain;
            this._accAuto += autoGain;

            if (!this._autoClickAnimTime) this._autoClickAnimTime = 0;
            this._autoClickAnimTime += dt;

            if (this._autoClickAnimTime >= 0.1) {
              this._autoClickAnimTime = 0;
              this.data.clickCount++;

              const plant = document.getElementById("plant-img");
              if (plant) {
                plant.classList.add("plant-pressed");
                setTimeout(() => plant.classList.remove("plant-pressed"), 50);
              }

              const clickArea = document.getElementById("click-area");
              let animEvent = null;
              if (clickArea) {
                const rect = clickArea.getBoundingClientRect();
                animEvent = {
                  clientX:
                    rect.left + rect.width / 2 + (Math.random() * 40 - 20),
                  clientY:
                    rect.top + rect.height / 2 + (Math.random() * 40 - 20),
                };
              }
              if (animEvent) {
                let showScore =
                  this._accAuto < 1
                    ? this._accAuto.toFixed(1)
                    : Math.floor(this._accAuto);
                this.createFloatingText(animEvent, `+${showScore}`);
              }
              this._accAuto = 0;
              this.triggerScoreAnim();
            }
          }
          this.updateUI();

          if (Math.floor(now / 1000) % 5 === 0) {
            this.save();
            this.checkAchievements();
          }
          requestAnimationFrame(() => this.loop());
        },
        checkAchievements() {
          if (!this.data.unlockedAchievements)
            this.data.unlockedAchievements = [];
          this.achievements.forEach((ach) => {
            if (!this.data.unlockedAchievements.includes(ach.id)) {
              if (ach.cond(this.data)) {
                this.data.unlockedAchievements.push(ach.id);
                this.showToast(t("achievements"), t(ach.title), "success");
                audioManager.playDing();
              }
            }
          });
        },
        buyUpgrade(t) {
          const u = this.data.upgrades[t];
          let cost = 0;
          if (t === "boost") {
            cost = u.b;
            if (Date.now() < this.data.boostEndTime) return;
          } else {
            cost = Math.floor(u.b * Math.pow(1.5, u.c));
          }
          if (this.data.points >= cost) {
            this.data.points -= cost;
            if (t === "auto") {
              this.data.autoPower += 1.0;
              u.c++;
            } else if (t === "click") {
              this.data.clickPower += 1;
              u.c++;
            } else if (t === "water") {
              this.data.clickPower += 2;
              u.c++;
            } else if (t === "shears") {
              this.data.autoPower += 5.0;
              u.c++;
            } else if (t === "gloves") {
              this.data.clickPower += 10;
              u.c++;
            } else if (t === "med") {
              this.data.autoPower += 25.0;
              u.c++;
            } else if (t === "boost") {
              this.data.boostEndTime = Date.now() + 60000;
              this.showToast(t("upg_boost"), t("bonus_boost"), "success");
            }
            this.updateUI();
            this.save();
            audioManager.playDing();
          } else {
            this.showToast(t("insufficient_sp"), t("collect_points"), "error");
          }
        },
        updateUI() {
          document.getElementById("big-plant-score").innerText = Math.floor(
            this.data.points
          ).toLocaleString();
          document.getElementById("lifetime-score").innerText = Math.floor(
            this.data.lifetimePoints || 0
          ).toLocaleString();
          document.getElementById("total-clicks").innerText =
            this.data.clickCount.toLocaleString();

          const currentLimit = this.getCurrentStageLimit();
          document.getElementById("next-level-req").innerText =
            currentLimit.toLocaleString();

          let prevLimit = 0;
          if (this.data.stage > 0) {
            const basePrev = this.stages[this.data.stage - 1].limit;
            const dimMult = Math.pow(10, this.data.dimension - 1);
            prevLimit = basePrev * dimMult;
          }

          const progressScore = this.data.lifetimePoints || 0;
          const progress = Math.max(
            0,
            Math.min(
              100,
              ((progressScore - prevLimit) / (currentLimit - prevLimit)) * 100
            )
          );
          document.getElementById("level-bar").style.width = progress + "%";

          let m = this.data.prestigeMultiplier;
          if (this.isNight) m *= 3.0;
          else m *= 1.0;
          if (Date.now() < this.data.boostEndTime) m *= 2;
          if (this.isRaining) m *= 2;

          document.getElementById("sps-display").innerText = (
            this.data.autoPower * m
          ).toFixed(1);

          const up = this.data.upgrades;
          const updateBtn = (id, type) => {
            const u = up[type];
            const elLvl = document.getElementById("lvl-" + id);
            const elCost = document.getElementById("cost-" + id);
            const elBtn = document.getElementById("btn-" + id);
            if (elLvl && elCost && elBtn) {
              elLvl.innerText = "Lvl " + u.c;
              const cost = Math.floor(u.b * Math.pow(1.5, u.c));
              elCost.innerText = cost.toLocaleString() + " SP";
              elBtn.disabled = this.data.points < cost;
            }
          };
          updateBtn("click", "click");
          updateBtn("water", "water");
          updateBtn("auto", "auto");
          updateBtn("shears", "shears");
          updateBtn("gloves", "gloves");
          updateBtn("med", "med");

          const boostBtn = document.getElementById("btn-ladybug");
          const statusContainer = document.getElementById(
            "boost-status-container"
          );
          if (Date.now() < this.data.boostEndTime) {
            boostBtn.disabled = true;
            const timeLeft = Math.ceil(
              (this.data.boostEndTime - Date.now()) / 1000
            );
            statusContainer.innerHTML = `<span class="text-red-500 font-bold text-sm">${timeLeft}s</span>`;
          } else {
            boostBtn.disabled = this.data.points < 500;
            statusContainer.innerHTML = `<img src="assets/tik.png" class="h-full object-contain">`;
          }

          document.getElementById("prestige-display").innerText =
            this.data.prestigeMultiplier.toFixed(1);
          document.getElementById("dim-display").innerText =
            this.data.dimension;
        },
        getCurrentStageLimit() {
          const baseLimit = this.stages[this.data.stage].limit;
          const multiplier = Math.pow(10, this.data.dimension - 1);
          return baseLimit * multiplier;
        },
        checkGrowth() {
          const currentLimit = this.getCurrentStageLimit();
          if ((this.data.lifetimePoints || 0) >= currentLimit) {
            if (this.data.stage >= this.stages.length - 1) {
              this.data.dimension++;
              this.data.stage = 0;
              this.showToast(
                t("level_up"),
                `${t("new_dimension")} ${this.data.dimension}`,
                "success"
              );
              audioManager.playDing();
              document
                .getElementById("btn-prestige")
                .classList.remove("hidden");
            } else {
              this.data.stage++;
              this.renderPlant();
              audioManager.playDing();
            }
          }
        },
        prestige() {
          if (!confirm("PRESTİJ: %50 Güç kazanıp sıfırlamak istiyor musun?"))
            return;
          this.data.prestigeMultiplier *= 1.5;
          this.data.points = 0;
          this.data.lifetimePoints = 0;
          this.data.stage = 0;
          this.data.clickPower = 1;
          this.data.autoPower = 0;
          this.data.upgrades = {
            click: { c: 0, b: 50 },
            water: { c: 0, b: 100 },
            auto: { c: 0, b: 15 },
            shears: { c: 0, b: 250 },
            gloves: { c: 0, b: 1000 },
            med: { c: 0, b: 5000 },
            boost: { c: 0, b: 500 },
          };
          this.renderPlant();
          this.updateUI();
          this.save();
          document.getElementById("btn-prestige").classList.add("hidden");
          this.showToast(t("rebirth"), t("stronger"), "success");
        },
        checkOfflineEarnings() {
          if (this.data.autoPower > 0 && this.data.lastSaveTime) {
            const seconds = (Date.now() - this.data.lastSaveTime) / 1000;
            if (seconds > 60) {
              const prestigeM = this.data.prestigeMultiplier;
              const earned = Math.floor(
                seconds * this.data.autoPower * prestigeM * 0.1
              );
              if (earned > 0) {
                this.data.points += earned;
                this.data.lifetimePoints += earned;
                this.data.lastSaveTime = Date.now();
                this.save();
                setTimeout(() => {
                  this.showToast(
                    t("offline_earnings"),
                    `+${earned} SP`,
                    "success"
                  );
                  audioManager.playDing();
                }, 1000);
              }
            }
          }
          this.data.lastSaveTime = Date.now();
        },
        showToast(title, msg, type = "info") {
          const c = document.getElementById("toast-container");
          const t = document.createElement("div");
          t.className = `toast-notification mb-2 bg-[#3f2e22] text-white p-4 rounded shadow border border-white/20`;
          t.innerHTML = `<div class="font-bold">${title}</div><div class="text-xs opacity-80">${msg}</div>`;
          c.appendChild(t);
          setTimeout(() => t.remove(), 3000);
        },
        toggleSettings() {
          document.getElementById("settings-modal").classList.toggle("hidden");
        },
        toggleInfo() {
          document.getElementById("info-modal").classList.toggle("hidden");
        },
        toggleAchievements() {
          const el = document.getElementById("achievements-modal");
          el.classList.toggle("hidden");
          if (!el.classList.contains("hidden")) {
            const list = document.getElementById("achievements-list");
            list.innerHTML = "";
            this.achievements.forEach((ach) => {
              const isUnlocked =
                this.data.unlockedAchievements &&
                this.data.unlockedAchievements.includes(ach.id);
              list.innerHTML += `
                <div class="achievement-item ${isUnlocked ? "unlocked" : ""}">
                  <div class="text-2xl">${isUnlocked ? "🏆" : "🔒"}</div>
                  <div>
                    <div class="font-bold ${
                      isUnlocked ? "text-yellow-400" : "text-gray-400"
                    }">${t(ach.title)}</div>
                    <div class="text-xs opacity-70">${t(ach.desc)}</div>
                  </div>
                </div>`;
            });
          }
        },
        renderPlant() {
          document.getElementById("plant-img").src =
            this.stages[this.data.stage].img;
          document.getElementById("level-name").innerText = t(
            this.stages[this.data.stage].name
          );
        },
        createFloatingText(e, t) {
          const el = document.createElement("div");
          el.innerText = t;
          el.className = "floating-text";
          const rect = document
            .getElementById("click-area")
            .getBoundingClientRect();
          const x =
            (e.clientX || rect.left + rect.width / 2) +
            (Math.random() * 40 - 20);
          const y = (e.clientY || rect.top + rect.height / 2) - 20;
          el.style.left = x + "px";
          el.style.top = y + "px";
          document.body.appendChild(el);
          setTimeout(() => el.remove(), 1000);
        },
        save() {
          this.data.lastSaveTime = Date.now();
          localStorage.setItem(this.saveKey, JSON.stringify(this.data));
        },
        load() {
          const s = localStorage.getItem(this.saveKey);
          const defaultUpgrades = {
            click: { c: 0, b: 50 },
            water: { c: 0, b: 100 },
            auto: { c: 0, b: 15 },
            shears: { c: 0, b: 250 },
            gloves: { c: 0, b: 1000 },
            med: { c: 0, b: 5000 },
            boost: { c: 0, b: 500 },
          };
          if (s) {
            try {
              const p = JSON.parse(s);
              this.data = { ...this.data, ...p };
              if (!this.data.upgrades) this.data.upgrades = {};
              for (const key in defaultUpgrades) {
                if (
                  !this.data.upgrades[key] ||
                  typeof this.data.upgrades[key] !== "object"
                ) {
                  this.data.upgrades[key] = { ...defaultUpgrades[key] };
                } else {
                  this.data.upgrades[key].b = defaultUpgrades[key].b;
                  if (typeof this.data.upgrades[key].c === "undefined")
                    this.data.upgrades[key].c = 0;
                }
              }
              if (typeof this.data.dimension === "undefined")
                this.data.dimension = 1;
            } catch (e) {
              localStorage.removeItem(this.saveKey);
            }
          }
        },
        resetSave() {
          if (confirm("SIFIRLAMAK istediğine emin misin?")) {
            localStorage.removeItem(this.saveKey);
            location.reload();
          }
        },
        weatherLoop() {
          if (Math.random() < 0.3) {
            this.isRaining = true;
            const l = document.getElementById("rain-layer");
            l.innerHTML = "";
            for (let i = 0; i < 50; i++) {
              const d = document.createElement("div");
              d.className = "rain-drop";
              d.style.left = Math.random() * 100 + "%";
              d.style.animationDuration = 0.5 + Math.random() * 0.5 + "s";
              d.style.animationDelay = Math.random() + "s";
              l.appendChild(d);
            }
          } else {
            this.isRaining = false;
            document.getElementById("rain-layer").innerHTML = "";
          }
        },
        toggleNightMode() {
          this.isNight = !this.isNight;
          if (this.isNight) {
            document.body.classList.add("night-mode");
            this.showToast(t("night_day"), "Auto x3", "info");
          } else {
            document.body.classList.remove("night-mode");
            this.showToast(t("night_day"), "Normal", "info");
          }
          this.weatherLoop();
          this.updateUI();
        },
        scheduleBee() {
          setTimeout(() => {
            this.spawnBee();
            this.scheduleBee();
          }, Math.random() * 60000 + 30000);
        },
        spawnBee() {
          if (!this.gameStarted) return;
          const b = document.createElement("div");
          b.innerHTML =
            '<img src="assets/bee.png" style="width: 80px; height: 80px; object-fit: contain;">';
          b.className = "bee-moving";
          b.style.top = 10 + Math.random() * 50 + "%";
          b.onclick = (e) => {
            e.stopPropagation();
            b.remove();
            let r = Math.max(
              500,
              Math.floor(
                this.data.autoPower * this.data.prestigeMultiplier * 300
              )
            );
            this.data.points += r;
            this.data.lifetimePoints += r;
            audioManager.playDing();
            this.showToast(t("bee"), `+${r} SP`, "success");
          };
          document.body.appendChild(b);
          setTimeout(() => b.remove(), 15000);
        },
        scheduleGoldenSeed() {
          setTimeout(() => {
            this.showGoldenSeed();
            this.scheduleGoldenSeed();
          }, Math.random() * 40000 + 20000);
        },
        showGoldenSeed() {
          if (!this.gameStarted) return;
          const e = document.getElementById("golden-seed");
          e.style.left = 10 + Math.random() * 80 + "%";
          e.style.top = 10 + Math.random() * 80 + "%";
          e.classList.remove("hidden");
          setTimeout(() => e.classList.add("hidden"), 3000);
        },
        catchGoldenSeed() {
          const e = document.getElementById("golden-seed");
          e.classList.add("hidden");
          const b = Math.max(100, Math.floor(this.data.points * 0.3));
          this.data.points += b;
          this.data.lifetimePoints += b;
          audioManager.playDing();
          this.showToast(t("golden_seed"), `+${b} SP!`, "success");
          this.updateUI();
        },
      };
      window.onload = () => game.init();
    </script>
  </body>
</html>
