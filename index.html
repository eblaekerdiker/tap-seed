<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tap Seed - Gelişmiş Versiyon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary: #380516;
            --bg-color: #fdfbf7;
        }

        body {
            background-color: var(--bg-color);
            color: var(--primary);
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* --- YENİ: RÜZGAR ANİMASYONU (IDLE) --- */
        @keyframes sway {
            0% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(2deg) scale(1); }
            75% { transform: rotate(-2deg) scale(1); }
            100% { transform: rotate(0deg) scale(1); }
        }
        
        /* Bitki normalde sallanır */
        .plant-idle {
            animation: sway 4s ease-in-out infinite;
            transform-origin: bottom center; /* Kökten sallasın */
        }

        /* --- YENİ: ELASTİK TIKLAMA EFEKTİ --- */
        .seed-container:active .plant-idle {
            animation: none; /* Tıklarken sallanmayı durdur */
            transform: scale(0.95, 0.85); /* Basıklaştır */
            transition: transform 0.05s;
        }

        /* Tıklama alanı */
        .seed-container {
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
        }

        #plant-img {
            pointer-events: none;
            filter: drop-shadow(0 10px 10px rgba(56, 5, 22, 0.2));
            transition: all 0.2s ease;
        }

        /* --- YENİ: YAĞMUR EFEKTİ --- */
        .rain-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 100, 0.1); /* Hafif mavi ton */
            pointer-events: none; /* Tıklamayı engelleme */
            z-index: 5;
            opacity: 0;
            transition: opacity 1s;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }
        .rain-drop {
            position: absolute;
            background: #a0c4ff;
            width: 2px;
            height: 15px;
            top: -20px;
            animation: rainFall 0.7s linear infinite;
        }
        @keyframes rainFall {
            to { transform: translateY(100vh); }
        }

        .floating-text {
            position: absolute;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 1s forwards;
            color: var(--primary);
            z-index: 50;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-50px) scale(1.2); }
        }

        .progress-ring__circle {
            transition: stroke-dashoffset 0.35s;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        .btn-upgrade {
            transition: all 0.2s;
            border: 1px solid var(--primary);
        }
        .btn-upgrade:hover:not(:disabled) {
            background-color: var(--primary);
            color: white;
        }
        .btn-upgrade:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: #ccc;
            color: #ccc;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-between p-6">

    <div id="rain-layer" class="rain-overlay"></div>

    <header class="w-full max-w-md flex justify-between items-center text-sm font-bold opacity-80 z-20">
        <div>SEVİYE: <span id="level-display">TOHUM</span></div>
        <div class="text-right">PRESTİJ: x<span id="prestige-display">1.0</span></div>
    </header>

    <main class="flex-grow flex flex-col items-center justify-center relative w-full z-20">
        
        <div class="absolute top-10 text-4xl font-black tracking-tighter">
            <span id="score-display">0</span> SP
        </div>
        <div id="weather-status" class="text-xs mt-1 mb-8 font-bold text-blue-500 opacity-0 transition-opacity">
            🌧️ YAĞMUR YAĞIYOR (x2 ÜRETİM)
        </div>
        
        <div class="text-xs absolute top-24 opacity-60">Saniyede: <span id="sps-display">0.0</span></div>

        <div id="click-area" class="seed-container relative w-72 h-72 rounded-full bg-transparent">
            <svg class="absolute w-full h-full" viewBox="0 0 120 120">
                <circle class="text-gray-200" stroke-width="2" stroke="currentColor" fill="transparent" r="54" cx="60" cy="60" />
                <circle id="progress-ring" class="text-[#380516] progress-ring__circle" stroke-width="4" stroke="currentColor" fill="transparent" r="54" cx="60" cy="60" stroke-dasharray="339.292" stroke-dashoffset="339.292" />
            </svg>
            <img id="plant-img" src="level1.png" alt="Bitki" class="plant-idle w-48 h-48 object-contain">
        </div>

        <div id="message-area" class="h-6 mt-4 text-sm font-bold text-[#380516] opacity-0 transition-opacity duration-500">
            KRİTİK BÜYÜME!
        </div>
    </main>

    <footer class="w-full max-w-md space-y-3 z-20 bg-[var(--bg-color)]">
        
        <button id="btn-auto" onclick="game.buyUpgrade('auto')" class="btn-upgrade w-full p-3 rounded-lg flex justify-between items-center bg-white shadow-sm">
            <div class="flex items-center gap-3">
                <div class="text-left">
                    <div class="font-bold text-sm">AUTO-TAP I</div>
                    <div class="text-xs opacity-60">+0.5/sn</div>
                </div>
            </div>
            <div class="font-bold text-sm" id="cost-auto">15 SP</div>
        </button>

        <button id="btn-click" onclick="game.buyUpgrade('click')" class="btn-upgrade w-full p-3 rounded-lg flex justify-between items-center bg-white shadow-sm">
            <div class="flex items-center gap-3">
                <div class="text-left">
                    <div class="font-bold text-sm">GÜÇLÜ KÖKLER</div>
                    <div class="text-xs opacity-60">+1 Tık Gücü</div>
                </div>
            </div>
            <div class="font-bold text-sm" id="cost-click">50 SP</div>
        </button>

        <button id="btn-boost" onclick="game.buyUpgrade('boost')" class="btn-upgrade w-full p-3 rounded-lg flex justify-between items-center bg-white shadow-sm">
            <div class="flex items-center gap-3">
                <div class="text-left">
                    <div class="font-bold text-sm">GÜNEŞ IŞIĞI</div>
                    <div class="text-xs opacity-60">60sn x2 Bonus</div>
                </div>
            </div>
            <div class="font-bold text-sm" id="cost-boost">500 SP</div>
        </button>

        <button id="btn-prestige" onclick="game.prestige()" class="hidden w-full p-3 mt-4 bg-[#380516] text-white rounded-lg font-bold shadow-lg hover:bg-black transition-colors">
            PRESTİJ: YENİ TOHUM (x1.5)
        </button>
        
        <div class="flex justify-between mt-2 px-1">
             <button onclick="audioManager.toggle()" id="mute-btn" class="text-xs opacity-50 hover:opacity-100 underline">SES: AÇIK</button>
             <button onclick="game.resetSave()" class="text-xs opacity-50 hover:opacity-100 text-red-500 underline">SIFIRLA</button>
        </div>
    </footer>
        <div id="golden-seed" onclick="game.catchGoldenSeed()" class="hidden absolute w-12 h-12 text-4xl cursor-pointer select-none animate-bounce z-50 transition-all hover:scale-125 flex items-center justify-center">
        🌟
    </div>

    <button onclick="ui.toggleAchievements()" class="absolute top-4 right-4 text-xs font-bold bg-white/50 p-2 rounded hover:bg-white z-30">
        🏆 BAŞARIMLAR
    </button>

    <div id="achievement-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center backdrop-blur-sm">
        <div class="bg-[#fdfbf7] border-4 border-[#380516] p-6 rounded-xl w-80 max-h-[80vh] overflow-y-auto relative shadow-2xl">
            <h2 class="text-xl font-black text-center mb-4 border-b-2 border-[#380516] pb-2">BAŞARIMLAR</h2>
            <button onclick="ui.toggleAchievements()" class="absolute top-2 right-2 text-xl font-bold hover:text-red-600">&times;</button>
            
            <div id="achievement-list" class="space-y-3 text-sm"></div>
        </div>
    </div>
    <script>
        const audioManager = {
            ctx: null, enabled: true,
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
            playPop() {
                if (!this.enabled) return; this.init();
                const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
                osc.frequency.setValueAtTime(600 + Math.random()*200, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.1);
            },
            toggle() {
                this.enabled = !this.enabled;
                document.getElementById('mute-btn').innerText = this.enabled ? "SES: AÇIK" : "SES: KAPALI";
            }
        };

        const game = {
            data: {
                points: 0, clickCount: 0, clickPower: 1, autoPower: 0, prestigeMultiplier: 1,
                stage: 0, boostEndTime: 0, lastSaveTime: Date.now(),
                upgrades: { auto: { c: 0, b: 15 }, click: { c: 0, b: 50 }, boost: { c: 0, b: 500 } }
            },
            isRaining: false, // Yağmur durumu
            rainTimer: 0,

            stages: [
                { name: "TOHUM", limit: 50, img: "level1.png" },
                { name: "FİLİZ", limit: 200, img: "level1.png" },
                { name: "BİTKİ", limit: 1000, img: "level2.png" },
                { name: "ÇİÇEK", limit: 5000, img: "level2.png" },
                { name: "AĞAÇ", limit: Infinity, img: "level3.png" }
            ],

            init() {
                this.load();
                this.checkOfflineEarnings(); // --- YENİ: Offline Kazanç Kontrolü ---
                this.updateUI();
                this.renderPlant();

                const area = document.getElementById('click-area');
                area.addEventListener('mousedown', (e) => this.handleClick(e));
                
                // Yağmur Döngüsü Başlat
                setInterval(() => this.weatherLoop(), 10000); // Her 10 saniyede bir hava durumunu kontrol et

                requestAnimationFrame(() => this.loop());
            },

            // --- YENİ: Offline Kazanç Fonksiyonu ---
            checkOfflineEarnings() {
                if (this.data.autoPower > 0 && this.data.lastSaveTime) {
                    const now = Date.now();
                    const secondsPassed = (now - this.data.lastSaveTime) / 1000;
                    if (secondsPassed > 60) { // 1 dakikadan fazla kapalı kaldıysa
                        const earned = Math.floor(secondsPassed * this.data.autoPower * this.data.prestigeMultiplier * 0.5); // Offline %50 verim
                        if (earned > 0) {
                            this.data.points += earned;
                            alert(`Hoş geldin! Sen yokken bitkin büyüdü ve ${earned} SP kazandırdı.`);
                        }
                    }
                }
            },

            // --- YENİ: Hava Durumu Mantığı ---
            weatherLoop() {
                // %20 şansla yağmur başlar veya durur
                if (Math.random() < 0.2) {
                    this.toggleRain(!this.isRaining);
                }
            },

            toggleRain(active) {
                this.isRaining = active;
                const layer = document.getElementById('rain-layer');
                const status = document.getElementById('weather-status');
                
                if (active) {
                    layer.style.opacity = 1;
                    status.style.opacity = 1;
                    this.createRainDrops();
                } else {
                    layer.style.opacity = 0;
                    status.style.opacity = 0;
                    layer.innerHTML = ''; // Damlaları temizle
                }
            },

            createRainDrops() {
                const layer = document.getElementById('rain-layer');
                // Basitçe 20 damla ekle
                for(let i=0; i<20; i++) {
                    const drop = document.createElement('div');
                    drop.className = 'rain-drop';
                    drop.style.left = Math.random() * 100 + '%';
                    drop.style.animationDuration = (0.5 + Math.random() * 0.5) + 's';
                    drop.style.animationDelay = Math.random() + 's';
                    layer.appendChild(drop);
                }
            },

            handleClick(e) {
                let mult = this.data.prestigeMultiplier;
                if (Date.now() < this.data.boostEndTime) mult *= 2;
                if (this.isRaining) mult *= 2; // --- YENİ: Yağmur bonusu ---

                let gain = this.data.clickPower * mult;
                this.data.points += gain;
                this.data.clickCount++;

                audioManager.playPop();
                this.createFloatingText(e, `+${Math.floor(gain)}`);
                this.checkGrowth();
                this.updateUI();
            },

            buyUpgrade(type) {
                const u = this.data.upgrades[type];
                let cost = Math.floor(u.b * Math.pow(1.5, u.c));
                if(type === 'boost') cost = u.b * (u.c + 1);

                if (this.data.points >= cost) {
                    this.data.points -= cost;
                    u.c++;
                    if (type === 'auto') this.data.autoPower += 0.5;
                    else if (type === 'click') this.data.clickPower += 1;
                    else if (type === 'boost') this.data.boostEndTime = Date.now() + 60000;
                    this.updateUI();
                    this.save();
                }
            },

            loop() {
                const now = Date.now();
                // Basit saniyelik döngü (frame independent değil ama basitlik için ok)
                if (this.data.autoPower > 0) {
                    let mult = this.data.prestigeMultiplier;
                    if (now < this.data.boostEndTime) mult *= 2;
                    if (this.isRaining) mult *= 2; // Yağmurda otomatik üretim de artar
                    
                    // 60FPS varsayımıyla her frame'de ekleme (daha pürüzsüz)
                    this.data.points += (this.data.autoPower * mult) / 60;
                }
                
                // Her 60 karede bir (yaklaşık 1 sn) arayüzü güncelle ki sayı çok titremesin
                if(this.data.clickCount % 10 === 0 || Math.random() < 0.1) this.updateUI();
                this.updateProgressRing();
                
                // Otomatik Kayıt
                if (Math.floor(now / 1000) % 5 === 0) this.save();
                
                requestAnimationFrame(() => this.loop());
            },

            checkGrowth() {
                const limit = this.stages[this.data.stage].limit;
                if (this.data.stage < this.stages.length - 1 && this.data.points >= limit) {
                    this.data.stage++;
                    this.renderPlant();
                }
                if (this.data.stage === this.stages.length - 1) {
                    document.getElementById('btn-prestige').classList.remove('hidden');
                }
            },

            prestige() {
                if(!confirm("Sıfırla ve bonus kazan?")) return;
                this.data.prestigeMultiplier *= 1.5;
                this.data.points = 0;
                this.data.stage = 0;
                this.data.clickPower = 1;
                this.data.autoPower = 0;
                this.data.upgrades = { auto: { c: 0, b: 15 }, click: { c: 0, b: 50 }, boost: { c: 0, b: 500 } };
                this.renderPlant();
                this.updateUI();
                this.save();
            },

            renderPlant() {
                document.getElementById('plant-img').src = this.stages[this.data.stage].img;
                document.getElementById('level-display').innerText = this.stages[this.data.stage].name;
            },

            createFloatingText(e, text) {
                const el = document.createElement('div');
                el.innerText = text;
                el.className = 'floating-text text-2xl';
                el.style.left = (e.clientX || window.innerWidth/2) + 'px';
                el.style.top = (e.clientY || window.innerHeight/2) + 'px';
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 1000);
            },

            updateProgressRing() {
                const circle = document.getElementById('progress-ring');
                const limit = this.stages[this.data.stage].limit;
                if(limit === Infinity) { circle.style.strokeDashoffset = 0; return; }
                
                const prevLimit = this.data.stage > 0 ? this.stages[this.data.stage-1].limit : 0;
                const total = limit - prevLimit;
                const current = this.data.points - prevLimit;
                const percent = Math.max(0, Math.min(100, (current/total)*100));
                
                const circ = 54 * 2 * Math.PI;
                circle.style.strokeDashoffset = circ - (percent/100) * circ;
            },

            updateUI() {
                document.getElementById('score-display').innerText = Math.floor(this.data.points).toLocaleString();
                
                let mult = this.data.prestigeMultiplier;
                if(Date.now() < this.data.boostEndTime) mult *= 2;
                if(this.isRaining) mult *= 2;

                document.getElementById('sps-display').innerText = (this.data.autoPower * mult).toFixed(1);
                document.getElementById('prestige-display').innerText = this.data.prestigeMultiplier.toFixed(1);

                const up = this.data.upgrades;
                // Maliyet hesaplamaları
                const costAuto = Math.floor(up.auto.b * Math.pow(1.5, up.auto.c));
                document.getElementById('cost-auto').innerText = costAuto + " SP";
                document.getElementById('btn-auto').disabled = this.data.points < costAuto;

                const costClick = Math.floor(up.click.b * Math.pow(1.5, up.click.c));
                document.getElementById('cost-click').innerText = costClick + " SP";
                document.getElementById('btn-click').disabled = this.data.points < costClick;
                
                // Boost butonu kontrolü
                const btnBoost = document.getElementById('btn-boost');
                if (Date.now() < this.data.boostEndTime) {
                    btnBoost.disabled = true;
                    document.getElementById('cost-boost').innerText = Math.ceil((this.data.boostEndTime - Date.now())/1000) + "s";
                } else {
                    const costBoost = up.boost.b * (up.boost.c + 1);
                    document.getElementById('cost-boost').innerText = costBoost + " SP";
                    btnBoost.disabled = this.data.points < costBoost;
                }
            },

            save() {
                this.data.lastSaveTime = Date.now();
                localStorage.setItem('tapSeedSavev2', JSON.stringify(this.data));
            },
            load() {
                const saved = localStorage.getItem('tapSeedSavev2');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    this.data = { ...this.data, ...parsed };
                }
            },
            resetSave() {
                localStorage.removeItem('tapSeedSavev2');
                location.reload();
            }
        };

        window.onload = () => game.init();
    </script>
</body>
</html>
