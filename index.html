<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Tap Seed - v6 Clean</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      /* --- GENEL AYARLAR --- */
      :root {
        --primary: #3f2e22;
      }
      body {
        font-family: "Inter", sans-serif;
        overflow: hidden;
        color: white;
        background-image: url("bac.png");
        background-size: cover;
        background-position: center;
        transition: filter 1s, background-color 1s;
      }

      /* --- UI NESNELERİ --- */

      /* Üst Köşe İkonları (Düzeltildi: Basıklık gitti) */
      .top-icon-btn {
        width: 50px;
        height: 50px;
        transition: transform 0.2s;
        cursor: pointer;
        filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.5));
        object-fit: contain; /* Görüntü oranını korur */
      }
      .top-icon-btn:hover {
        transform: scale(1.1) rotate(10deg);
      }
      .top-icon-btn:active {
        transform: scale(0.9);
      }

      /* Logo (Küçültüldü) */
      .game-logo {
        position: absolute;
        top: 20px;
        left: 20px;
        width: 120px; /* Daha küçük */
        z-index: 60;
        filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.5));
        object-fit: contain;
      }

      /* Market Kutuları (Daraltıldı) */
      .shop-item-btn {
        background-color: rgba(255, 255, 255, 0.85);
        border: 2px solid rgba(255, 255, 255, 0.5);
        border-radius: 10px;
        padding: 0.5rem 1rem; /* Daha az boşluk */
        color: #000;
        display: flex;
        align-items: center;
        justify-content: space-between;
        transition: all 0.2s;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        width: 100%;
        height: 70px; /* Yükseklik düşürüldü (Eskisi 100px idi) */
      }
      .shop-item-btn:hover:not(:disabled) {
        transform: translateX(-5px);
        background-color: rgba(255, 255, 255, 0.95);
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
      }
      .shop-item-btn:disabled {
        opacity: 0.6;
        filter: grayscale(1);
        cursor: not-allowed;
      }

      /* Seviye Paneli */
      .level-panel {
        background-color: rgba(0, 0, 0, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(4px);
        border-radius: 16px;
        padding: 0.8rem;
        width: 100%;
        max-width: 400px;
        margin-top: 0.5rem;
        text-align: center;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
      }

      /* --- EFEKTLER --- */
      .rain-drop {
        position: absolute;
        background: #a0c4ff;
        width: 2px;
        height: 15px;
        animation: rainFall 0.7s linear infinite;
        z-index: 10;
      }
      @keyframes rainFall {
        to {
          transform: translateY(100vh);
        }
      }

      @keyframes sway {
        0%,
        100% {
          transform: rotate(0deg);
        }
        25% {
          transform: rotate(1deg);
        }
        75% {
          transform: rotate(-1deg);
        }
      }
      .plant-idle {
        animation: sway 5s ease-in-out infinite;
        transform-origin: bottom center;
        transition: transform 0.1s;
      }
      .plant-click-anim {
        transform: scale(0.95) !important;
      }

      #plant-score-wrapper {
        position: absolute;
        top: 15%;
        left: 50%;
        transform: translateX(-50%);
        z-index: 60;
        text-align: center;
        pointer-events: none;
        width: 100%;
      }

      .big-score-text {
        font-size: 4rem;
        font-weight: 900;
        color: white;
        text-shadow: 0 4px 0 #3f2e22, 0 0 20px rgba(255, 255, 255, 0.5);
        line-height: 1;
        animation: float-gentle 3s ease-in-out infinite;
      }
      .sp-label {
        font-size: 1.5rem;
        font-weight: 700;
        color: #fef08a;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
      }
      .score-pop {
        animation: scorePopAnim 0.15s ease-out forwards;
      }
      @keyframes scorePopAnim {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.2);
          color: #facc15;
        }
        100% {
          transform: scale(1);
        }
      }
      @keyframes float-gentle {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }

      .floating-text {
        position: absolute;
        font-weight: 900;
        pointer-events: none;
        animation: floatUp 0.8s cubic-bezier(0, 0.9, 0.57, 1) forwards;
        color: #fff;
        text-shadow: 0 2px 0 #000;
        z-index: 70;
        font-size: 2rem;
      }
      @keyframes floatUp {
        0% {
          opacity: 1;
          transform: translateY(0) scale(0.5);
        }
        50% {
          transform: scale(1.2);
        }
        100% {
          opacity: 0;
          transform: translateY(-100px) scale(1);
        }
      }

      .progress-container {
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      .modal-bg {
        background-color: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(8px);
      }

      .glass-stat {
        background-color: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(8px);
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 0.5rem;
      }

      .achievement-item {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 10px;
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
        opacity: 0.5;
        filter: grayscale(1);
        transition: 0.3s;
      }
      .achievement-item.unlocked {
        opacity: 1;
        filter: grayscale(0);
        background: rgba(255, 215, 0, 0.2);
        border: 1px solid rgba(255, 215, 0, 0.5);
      }

      /* Responsive */
      @media (max-width: 1024px) {
        body {
          flex-direction: column;
          overflow-y: auto;
        }
        #left-zone {
          height: auto;
          min-height: 60vh;
          width: 100%;
          padding-top: 60px;
        }
        #right-zone {
          width: 100%;
          height: auto;
          min-height: 50vh;
        }
        .game-logo {
          width: 90px;
        }
      }

      .close-btn {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 30px;
        height: 30px;
        background: red;
        color: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-weight: bold;
      }
    </style>
  </head>

  <body class="flex h-screen w-full relative">
    <div
      id="rain-layer"
      class="absolute inset-0 pointer-events-none z-10"
    ></div>

    <img src="logo- tap seed.png" class="game-logo" alt="Tap Seed Logo" />

    <div class="absolute top-5 right-5 z-[80] flex gap-3">
      <img
        src="basarimlar.png"
        onclick="game.toggleAchievements()"
        class="top-icon-btn"
        title="Başarımlar"
      />
      <img
        src="cark.png"
        onclick="game.toggleSettings()"
        class="top-icon-btn"
        title="Ayarlar"
      />
    </div>

    <section
      id="left-zone"
      class="w-full lg:w-3/5 h-full relative flex flex-col items-center justify-center select-none z-40 p-4"
    >
      <div
        id="golden-seed"
        onclick="game.catchGoldenSeed(); event.stopPropagation();"
        class="hidden absolute z-50 hover:scale-110 transition"
      >
        <img
          id="golden-seed-img"
          src="yıldız.png"
          class="w-20 h-20 drop-shadow-lg animate-spin"
          alt="Bonus"
        />
      </div>

      <div id="plant-score-wrapper">
        <div id="big-plant-score" class="big-score-text">0</div>
        <span class="sp-label">TOHUM PUANI</span>
      </div>

      <div
        id="click-area"
        onclick="game.handleClick(event)"
        class="relative w-[400px] h-[400px] z-40 flex items-center justify-center cursor-pointer group mt-8"
      >
        <img
          id="plant-img"
          src="level1.png"
          class="plant-idle w-full h-full object-contain drop-shadow-2xl group-hover:scale-105 transition-transform"
        />
      </div>

      <div class="level-panel">
        <div class="flex justify-between items-end mb-2">
          <div>
            <h2
              class="text-[10px] font-bold opacity-70 tracking-widest uppercase mb-1 text-yellow-100 text-left"
            >
              SEVİYE
            </h2>
            <h1
              id="level-name"
              class="text-2xl font-black leading-none text-white drop-shadow-md text-left"
            >
              TOHUM
            </h1>
          </div>
          <div class="text-right">
            <div class="text-[10px] bg-white/20 px-2 py-1 rounded mb-1">
              Boyut:
              <span id="dim-display" class="font-bold text-yellow-300">1</span>
            </div>
            <div class="text-[10px] font-bold opacity-80 text-yellow-100">
              Hedef: <span id="next-level-req">100</span>
            </div>
          </div>
        </div>
        <div
          class="progress-container h-3 rounded-full overflow-hidden relative w-full"
        >
          <div
            id="level-bar"
            class="h-full bg-gradient-to-r from-green-500 to-yellow-400 transition-all duration-300"
            style="width: 0%"
          ></div>
        </div>
      </div>
    </section>

    <section
      id="right-zone"
      class="w-full lg:w-2/5 h-full p-4 lg:p-8 relative z-40 flex flex-col pointer-events-none bg-black/20 backdrop-blur-sm"
    >
      <div
        class="pointer-events-auto w-full h-full flex flex-col gap-4 overflow-y-auto pt-16 lg:pt-4"
      >
        <div class="grid grid-cols-2 gap-3 shrink-0">
          <div class="glass-stat flex flex-col items-center">
            <div class="text-[10px] text-white/80 font-bold uppercase">
              Saniye Başına
            </div>
            <div class="text-xl font-black text-lime-300">
              +<span id="sps-display">0.0</span>
            </div>
          </div>
          <div class="glass-stat flex flex-col items-center">
            <div class="text-[10px] text-white/80 font-bold uppercase">
              Toplam Tık
            </div>
            <div class="text-xl font-black text-white" id="total-clicks">0</div>
          </div>
        </div>

        <h3
          class="text-white font-black text-xl mt-2 drop-shadow-md shrink-0 border-b border-white/20 pb-2"
        >
          MARKET
        </h3>

        <div class="flex flex-col gap-2 pb-20">
          <button
            id="btn-sun"
            onclick="game.buyUpgrade('click')"
            class="shop-item-btn group"
          >
            <div class="flex items-center gap-3">
              <div
                class="text-3xl filter drop-shadow-md group-hover:scale-110 transition"
              >
                ☀️
              </div>
              <div class="text-left leading-tight">
                <div class="font-black text-md">Güneş Işığı</div>
                <div class="text-[10px] text-gray-600 font-bold" id="lvl-click">
                  Seviye 1
                </div>
              </div>
            </div>
            <div class="text-right leading-tight">
              <div class="font-black text-md" id="cost-click">50 SP</div>
              <div class="text-[10px] text-gray-500 font-bold">+1 Tık</div>
            </div>
          </button>

          <button
            id="btn-fert"
            onclick="game.buyUpgrade('auto')"
            class="shop-item-btn group"
          >
            <div class="flex items-center gap-3">
              <div
                class="text-3xl filter drop-shadow-md group-hover:scale-110 transition"
              >
                💩
              </div>
              <div class="text-left leading-tight">
                <div class="font-black text-md">Doğal Gübre</div>
                <div class="text-[10px] text-gray-600 font-bold" id="lvl-auto">
                  Seviye 0
                </div>
              </div>
            </div>
            <div class="text-right leading-tight">
              <div class="font-black text-md" id="cost-auto">15 SP</div>
              <div class="text-[10px] text-gray-500 font-bold">+0.5 Oto</div>
            </div>
          </button>

          <button
            id="btn-ladybug"
            onclick="game.buyUpgrade('boost')"
            class="shop-item-btn group"
          >
            <div class="flex items-center gap-3">
              <div
                class="text-3xl filter drop-shadow-md group-hover:rotate-12 transition"
              >
                🐞
              </div>
              <div class="text-left leading-tight">
                <div class="font-black text-md">Uğur Böceği</div>
                <div class="text-[10px] text-red-600 font-bold">
                  Hız x2 (60sn)
                </div>
              </div>
            </div>
            <div class="flex flex-col items-end leading-tight">
              <div
                id="boost-status-container"
                class="h-5 flex items-center"
              ></div>
              <div class="font-black text-md" id="cost-boost">500 SP</div>
            </div>
          </button>

          <button
            id="btn-prestige"
            onclick="game.prestige()"
            class="hidden shop-item-btn !bg-gradient-to-r from-yellow-100 to-yellow-200 !border-yellow-400"
          >
            <div class="flex items-center gap-3">
              <img src="kupa.png" class="w-8 h-8 object-contain" />
              <div class="text-left leading-tight">
                <div class="font-black text-md text-yellow-800">PRESTİJ</div>
                <div class="text-[10px] text-yellow-700 font-bold">
                  Boyut Atla
                </div>
              </div>
            </div>
            <div class="text-right font-black text-yellow-900 text-xs">
              %50 GÜÇ
            </div>
          </button>
        </div>
      </div>
    </section>

    <div
      id="achievements-modal"
      class="hidden fixed inset-0 modal-bg z-[100] flex items-center justify-center p-4"
    >
      <div
        class="bg-[#3f2e22] border-4 border-[#5d4037] rounded-2xl w-full max-w-lg max-h-[80vh] overflow-y-auto relative p-6 text-white shadow-2xl"
      >
        <div onclick="game.toggleAchievements()" class="close-btn">X</div>
        <h2 class="text-2xl font-black mb-4 text-center text-yellow-400">
          BAŞARIMLAR
        </h2>
        <div id="achievements-list" class="space-y-2"></div>
      </div>
    </div>

    <div
      id="settings-modal"
      class="hidden fixed inset-0 modal-bg z-[100] flex items-center justify-center"
    >
      <div
        class="bg-[#3f2e22] border-4 border-[#5d4037] rounded-2xl w-80 relative text-center shadow-2xl p-6"
      >
        <div onclick="game.toggleSettings()" class="close-btn">X</div>
        <h3 class="font-bold text-xl mb-6 text-white">AYARLAR</h3>
        <div class="flex flex-col gap-4 items-center w-full">
          <button
            onclick="audioManager.toggle()"
            class="w-16 h-16 rounded-full shadow-lg transition hover:scale-110 bg-white/10 flex items-center justify-center"
          >
            <img
              id="sound-icon-img"
              src="ses-ac.png"
              class="w-10 h-10 object-contain"
            />
          </button>
          <div class="text-xs text-white opacity-70">Ses Durumu</div>

          <button
            onclick="game.toggleNightMode()"
            class="p-3 bg-slate-700 text-white rounded-xl hover:bg-slate-800 font-bold transition w-full"
          >
            GECE / GÜNDÜZ
          </button>
          <button
            onclick="game.toggleInfo()"
            class="p-3 bg-blue-600 text-white rounded-xl hover:bg-blue-700 font-bold transition w-full"
          >
            NASIL OYNANIR?
          </button>
          <hr class="my-2 w-full border-white/10" />
          <button
            onclick="game.resetSave()"
            class="p-3 bg-red-800/80 text-white border border-red-600 rounded-xl hover:bg-red-900 font-bold transition w-full"
          >
            SIFIRLA
          </button>
        </div>
      </div>
    </div>

    <div
      id="info-modal"
      class="hidden fixed inset-0 modal-bg z-[110] flex items-center justify-center p-4"
    >
      <div
        class="bg-[#3f2e22] border-4 border-[#5d4037] rounded-2xl w-full max-w-md p-6 text-white relative"
      >
        <div onclick="game.toggleInfo()" class="close-btn">X</div>
        <h2 class="font-bold text-xl mb-4">REHBER</h2>
        <p class="text-sm opacity-80">
          Toprağa tıkla, tohumları büyüt. Space tuşuna basılı tutarak seri
          tıklayabilirsin!
        </p>
      </div>
    </div>

    <div
      id="start-screen"
      class="fixed inset-0 bg-slate-900 z-[9999] flex flex-col items-center justify-center text-white transition-opacity duration-500"
      style="background-image: url('bac.png'); background-size: cover"
    >
      <div class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>
      <div class="relative z-10 flex flex-col items-center">
        <img
          src="logo- tap seed.png"
          class="w-64 md:w-80 object-contain mb-8 drop-shadow-2xl animate-pulse"
        />
        <button
          onclick="game.startGame()"
          class="px-16 py-6 text-2xl font-black text-[#3f2e22] bg-white rounded-full tracking-wider hover:scale-105 transition shadow-xl border-4 border-[#3f2e22]"
        >
          OYUNA BAŞLA
        </button>
        <div class="mt-8 text-white/50 text-xs font-mono">
          v6.0 - No Seasons
        </div>
      </div>
    </div>

    <div id="toast-container" class="fixed top-24 right-5 z-[90]"></div>

    <script>
      /* --- SPACE TUŞU SERİ TIKLAMA (Hızlandırıldı: 50ms) --- */
      let spaceInterval = null;

      window.addEventListener("keydown", (e) => {
        if (e.code === "Space" && !e.repeat && game.gameStarted) {
          game.handleClick(null); // Anında tık
          if (!spaceInterval) {
            // 50 milisaniyede bir tıklar (saniyede 20 tık)
            spaceInterval = setInterval(() => {
              game.handleClick(null);
            }, 50);
          }
        }
      });

      window.addEventListener("keyup", (e) => {
        if (e.code === "Space") {
          clearInterval(spaceInterval);
          spaceInterval = null;
          document
            .getElementById("plant-img")
            .classList.remove("plant-click-anim");
        }
      });

      const audioManager = {
        ctx: null,
        enabled: true,
        init() {
          if (!this.ctx)
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        },
        resume() {
          if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
        },
        playPop() {
          if (!this.enabled) return;
          try {
            this.init();
            this.resume();
            const o = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            o.frequency.setValueAtTime(
              400 + Math.random() * 100,
              this.ctx.currentTime
            );
            g.gain.setValueAtTime(0.05, this.ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(
              0.001,
              this.ctx.currentTime + 0.1
            );
            o.connect(g);
            g.connect(this.ctx.destination);
            o.start();
            o.stop(this.ctx.currentTime + 0.1);
          } catch (e) {}
        },
        playDing() {
          if (!this.enabled) return;
          try {
            this.init();
            this.resume();
            const o = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            o.type = "sine";
            o.frequency.setValueAtTime(800, this.ctx.currentTime);
            g.gain.setValueAtTime(0.05, this.ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(
              0.001,
              this.ctx.currentTime + 0.5
            );
            o.connect(g);
            g.connect(this.ctx.destination);
            o.start();
            o.stop(this.ctx.currentTime + 0.5);
          } catch (e) {}
        },
        toggle() {
          this.enabled = !this.enabled;
          document.getElementById("sound-icon-img").src = this.enabled
            ? "ses-ac.png"
            : "ses-kapa.png";
        },
      };

      const game = {
        saveKey: "tapSeed_v6",
        data: {
          points: 0,
          clickCount: 0,
          clickPower: 1,
          autoPower: 0,
          prestigeMultiplier: 1,
          stage: 0,
          dimension: 1,
          boostEndTime: 0,
          lastSaveTime: Date.now(),
          upgrades: {
            auto: { c: 0, b: 15 },
            click: { c: 0, b: 50 },
            boost: { c: 0, b: 500 },
          },
          unlockedAchievements: [],
        },
        achievements: [
          {
            id: 1,
            title: "İlk Adım",
            desc: "1 kere tıkla",
            cond: (d) => d.clickCount >= 1,
          },
          {
            id: 2,
            title: "Çalışkan Çiftçi",
            desc: "500 kere tıkla",
            cond: (d) => d.clickCount >= 500,
          },
          {
            id: 3,
            title: "Otomasyon",
            desc: "Gübre seviyesi 5 yap",
            cond: (d) => d.upgrades.auto.c >= 5,
          },
          {
            id: 4,
            title: "Zengin",
            desc: "10.000 SP biriktir",
            cond: (d) => d.points >= 10000,
          },
          {
            id: 5,
            title: "Boyut Gezgini",
            desc: "2. Boyuta geç",
            cond: (d) => d.dimension >= 2,
          },
        ],
        stages: [
          { name: "TOHUM", limit: 500, img: "level1.png" },
          { name: "MİNİK FİLİZ", limit: 3000, img: "level2.png" },
          { name: "YEŞEREN FİDAN", limit: 15000, img: "level3.png" },
          { name: "GENÇ AĞAÇ", limit: 75000, img: "level4.png" },
          { name: "GÜÇLÜ GÖVDE", limit: 300000, img: "level5.png" },
          { name: "ÇİÇEKLİ AĞAÇ", limit: 1000000, img: "level6.png" },
          { name: "MEYVE VEREN", limit: 5000000, img: "level7.png" },
          { name: "ORMAN BEKÇİSİ", limit: 25000000, img: "level8.png" },
          { name: "ULU ÇINAR", limit: 100000000, img: "level9.png" },
          { name: "KADİM MEŞE", limit: 500000000, img: "level10.png" },
          { name: "DOĞA RUHU", limit: 2500000000, img: "level11.png" },
          { name: "HAYAT AĞACI", limit: 10000000000, img: "level12.png" },
          { name: "GÖKYÜZÜ SÜTUNU", limit: 100000000000, img: "level13.png" },
          { name: "YILDIZ TOHUMU", limit: 500000000000, img: "level14.png" },
          { name: "EVRENİN NEFESİ", limit: 2000000000000, img: "level15.png" },
        ],
        // Mevsimler silindi
        isRaining: false,
        isNight: false,
        gameStarted: false,

        init() {
          this.load();
          this.updateUI();
          this.renderPlant();
        },
        startGame() {
          if (this.gameStarted) return;
          this.gameStarted = true;
          document.getElementById("start-screen").classList.add("hidden");
          setTimeout(
            () => document.getElementById("start-screen").remove(),
            600
          );
          audioManager.init();
          audioManager.resume();
          this.checkOfflineEarnings();
          setInterval(() => this.weatherLoop(), 15000);
          setInterval(() => this.toggleNightMode(), 180000);
          this.scheduleGoldenSeed();
          this.scheduleBee();
          requestAnimationFrame(() => this.loop());
        },
        handleClick(e, isAuto = false) {
          let m = this.data.prestigeMultiplier;
          if (this.isNight) m *= 0.5;
          if (Date.now() < this.data.boostEndTime) m *= 2;
          if (this.isRaining) m *= 2;
          let gain = this.data.clickPower * m;
          this.data.points += gain;
          if (!isAuto) this.data.clickCount++;

          if (!isAuto) {
            audioManager.playPop();
            if (e) this.createFloatingText(e, `+${Math.floor(gain)}`);
            this.triggerScoreAnim();
            const plant = document.getElementById("plant-img");
            plant.classList.add("plant-click-anim");
            setTimeout(() => plant.classList.remove("plant-click-anim"), 100);
          }
          this.checkGrowth();
          this.checkAchievements();
          this.updateUI();
        },
        triggerScoreAnim() {
          const el = document.getElementById("big-plant-score");
          el.classList.remove("score-pop");
          void el.offsetWidth;
          el.classList.add("score-pop");
        },
        loop() {
          if (!this.gameStarted) return;
          const now = Date.now();
          if (this.data.autoPower > 0) {
            let m = this.data.prestigeMultiplier;
            if (this.isNight) m *= 3.0;
            if (now < this.data.boostEndTime) m *= 2;
            if (this.isRaining) m *= 2;
            this.data.points += (this.data.autoPower * m) / 60;
          }
          if (this.data.clickCount % 10 === 0 || Math.random() < 0.1)
            this.updateUI();
          if (Math.floor(now / 1000) % 5 === 0) {
            this.save();
            this.checkAchievements();
          }
          requestAnimationFrame(() => this.loop());
        },
        checkAchievements() {
          if (!this.data.unlockedAchievements)
            this.data.unlockedAchievements = [];
          this.achievements.forEach((ach) => {
            if (!this.data.unlockedAchievements.includes(ach.id)) {
              if (ach.cond(this.data)) {
                this.data.unlockedAchievements.push(ach.id);
                this.showToast("BAŞARIM AÇILDI!", ach.title, "success");
                audioManager.playDing();
              }
            }
          });
        },
        buyUpgrade(t) {
          const u = this.data.upgrades[t];
          let cost = 0;
          if (t === "boost") {
            cost = u.b;
            if (Date.now() < this.data.boostEndTime) return;
          } else {
            cost = Math.floor(u.b * Math.pow(1.5, u.c));
          }
          if (this.data.points >= cost) {
            this.data.points -= cost;
            if (t === "auto") {
              this.data.autoPower += 0.5;
              u.c++;
            } else if (t === "click") {
              this.data.clickPower += 1;
              u.c++;
            } else if (t === "boost") {
              this.data.boostEndTime = Date.now() + 60000;
              this.showToast("UĞUR BÖCEKLERİ!", "Hız x2 (60sn)", "success");
            }
            this.updateUI();
            this.save();
            audioManager.playDing();
          } else {
            this.showToast("Yetersiz SP", "Puan biriktir.", "error");
          }
        },
        updateUI() {
          document.getElementById("big-plant-score").innerText = Math.floor(
            this.data.points
          ).toLocaleString();
          document.getElementById("total-clicks").innerText =
            this.data.clickCount.toLocaleString();

          const currentLimit = this.getCurrentStageLimit();
          document.getElementById("next-level-req").innerText =
            currentLimit.toLocaleString();

          let prevLimit = 0;
          if (this.data.stage > 0) {
            const basePrev = this.stages[this.data.stage - 1].limit;
            const dimMult = Math.pow(10, this.data.dimension - 1);
            prevLimit = basePrev * dimMult;
          }
          const progress = Math.max(
            0,
            Math.min(
              100,
              ((this.data.points - prevLimit) / (currentLimit - prevLimit)) *
                100
            )
          );
          document.getElementById("level-bar").style.width = progress + "%";

          let m = this.data.prestigeMultiplier;
          if (this.isNight) m *= 3.0;
          else m *= 1.0;
          if (Date.now() < this.data.boostEndTime) m *= 2;
          if (this.isRaining) m *= 2;

          document.getElementById("sps-display").innerText = (
            this.data.autoPower * m
          ).toFixed(1);

          const up = this.data.upgrades;
          document.getElementById("lvl-click").innerText =
            "Seviye " + (up.click.c + 1);
          document.getElementById("cost-click").innerText =
            Math.floor(
              up.click.b * Math.pow(1.5, up.click.c)
            ).toLocaleString() + " SP";
          document.getElementById("btn-sun").disabled =
            this.data.points <
            Math.floor(up.click.b * Math.pow(1.5, up.click.c));

          document.getElementById("lvl-auto").innerText = "Seviye " + up.auto.c;
          document.getElementById("cost-auto").innerText =
            Math.floor(up.auto.b * Math.pow(1.5, up.auto.c)).toLocaleString() +
            " SP";
          document.getElementById("btn-fert").disabled =
            this.data.points < Math.floor(up.auto.b * Math.pow(1.5, up.auto.c));

          const boostBtn = document.getElementById("btn-ladybug");
          const statusContainer = document.getElementById(
            "boost-status-container"
          );
          if (Date.now() < this.data.boostEndTime) {
            boostBtn.disabled = true;
            const timeLeft = Math.ceil(
              (this.data.boostEndTime - Date.now()) / 1000
            );
            statusContainer.innerHTML = `<span class="text-red-500 font-bold text-sm">${timeLeft}s</span>`;
          } else {
            boostBtn.disabled = this.data.points < 500;
            statusContainer.innerHTML = `<img src="tik.png" class="h-full object-contain">`;
          }

          document.getElementById("prestige-display").innerText =
            this.data.prestigeMultiplier.toFixed(1);
          document.getElementById("dim-display").innerText =
            this.data.dimension;
        },
        getCurrentStageLimit() {
          const baseLimit = this.stages[this.data.stage].limit;
          const multiplier = Math.pow(10, this.data.dimension - 1);
          return baseLimit * multiplier;
        },
        checkGrowth() {
          const currentLimit = this.getCurrentStageLimit();
          if (this.data.points >= currentLimit) {
            if (this.data.stage >= this.stages.length - 1) {
              this.data.dimension++;
              this.data.stage = 0;
              this.showToast(
                "🌌 BOYUT ATLADIN!",
                `Yeni Boyut: ${this.data.dimension}`,
                "success"
              );
              audioManager.playDing();
              document
                .getElementById("btn-prestige")
                .classList.remove("hidden");
            } else {
              this.data.stage++;
              this.renderPlant();
              audioManager.playDing();
            }
          }
        },
        prestige() {
          if (!confirm("PRESTİJ: %50 Güç kazanıp sıfırlamak istiyor musun?"))
            return;
          this.data.prestigeMultiplier *= 1.5;
          this.data.points = 0;
          this.data.stage = 0;
          this.data.clickPower = 1;
          this.data.autoPower = 0;
          this.data.upgrades = {
            auto: { c: 0, b: 15 },
            click: { c: 0, b: 50 },
            boost: { c: 0, b: 500 },
          };
          this.renderPlant();
          this.updateUI();
          this.save();
          document.getElementById("btn-prestige").classList.add("hidden");
          this.showToast("YENİDEN DOĞUŞ", "Daha güçlüsün!", "success");
        },
        checkOfflineEarnings() {
          if (this.data.autoPower > 0 && this.data.lastSaveTime) {
            const seconds = (Date.now() - this.data.lastSaveTime) / 1000;
            if (seconds > 60) {
              const prestigeM = this.data.prestigeMultiplier;
              const earned = Math.floor(
                seconds * this.data.autoPower * prestigeM * 0.1
              );
              if (earned > 0) {
                this.data.points += earned;
                this.data.lastSaveTime = Date.now();
                this.save();
                setTimeout(() => {
                  this.showToast(
                    "ÇEVRİMDIŞI KAZANÇ",
                    `+${earned} SP`,
                    "success"
                  );
                  audioManager.playDing();
                }, 1000);
              }
            }
          }
          this.data.lastSaveTime = Date.now();
        },
        showToast(title, msg, type = "info") {
          const c = document.getElementById("toast-container");
          const t = document.createElement("div");
          t.className = `toast-notification mb-2 bg-[#3f2e22] text-white p-4 rounded shadow border border-white/20`;
          t.innerHTML = `<div class="font-bold">${title}</div><div class="text-xs opacity-80">${msg}</div>`;
          c.appendChild(t);
          setTimeout(() => t.remove(), 3000);
        },
        toggleSettings() {
          document.getElementById("settings-modal").classList.toggle("hidden");
        },
        toggleInfo() {
          document.getElementById("info-modal").classList.toggle("hidden");
        },

        toggleAchievements() {
          const el = document.getElementById("achievements-modal");
          el.classList.toggle("hidden");
          if (!el.classList.contains("hidden")) {
            const list = document.getElementById("achievements-list");
            list.innerHTML = "";
            this.achievements.forEach((ach) => {
              const isUnlocked =
                this.data.unlockedAchievements &&
                this.data.unlockedAchievements.includes(ach.id);
              list.innerHTML += `
                        <div class="achievement-item ${
                          isUnlocked ? "unlocked" : ""
                        }">
                            <div class="text-2xl">${
                              isUnlocked ? "🏆" : "🔒"
                            }</div>
                            <div>
                                <div class="font-bold ${
                                  isUnlocked
                                    ? "text-yellow-400"
                                    : "text-gray-400"
                                }">${ach.title}</div>
                                <div class="text-xs opacity-70">${
                                  ach.desc
                                }</div>
                            </div>
                        </div>
                    `;
            });
          }
        },
        renderPlant() {
          document.getElementById("plant-img").src =
            this.stages[this.data.stage].img;
          document.getElementById("level-name").innerText =
            this.stages[this.data.stage].name;
        },
        createFloatingText(e, t) {
          const el = document.createElement("div");
          el.innerText = t;
          el.className = "floating-text";
          const rect = document
            .getElementById("click-area")
            .getBoundingClientRect();
          const x =
            (e.clientX || rect.left + rect.width / 2) +
            (Math.random() * 40 - 20);
          const y = (e.clientY || rect.top + rect.height / 2) - 20;
          el.style.left = x + "px";
          el.style.top = y + "px";
          document.body.appendChild(el);
          setTimeout(() => el.remove(), 1000);
        },
        save() {
          this.data.lastSaveTime = Date.now();
          localStorage.setItem(this.saveKey, JSON.stringify(this.data));
        },
        load() {
          const s = localStorage.getItem(this.saveKey);
          if (s) {
            const p = JSON.parse(s);
            this.data = { ...this.data, ...p };
            if (this.data.dimension === undefined) this.data.dimension = 1;
            if (!this.data.unlockedAchievements)
              this.data.unlockedAchievements = [];
          }
        },
        resetSave() {
          if (confirm("SIFIRLAMAK istediğine emin misin?")) {
            localStorage.removeItem(this.saveKey);
            location.reload();
          }
        },
        weatherLoop() {
          if (Math.random() < 0.3) {
            this.isRaining = true;
            const l = document.getElementById("rain-layer");
            l.innerHTML = "";
            for (let i = 0; i < 50; i++) {
              const d = document.createElement("div");
              d.className = "rain-drop";
              d.style.left = Math.random() * 100 + "%";
              d.style.animationDuration = 0.5 + Math.random() * 0.5 + "s";
              d.style.animationDelay = Math.random() + "s";
              l.appendChild(d);
            }
          } else {
            this.isRaining = false;
            document.getElementById("rain-layer").innerHTML = "";
          }
        },
        toggleNightMode() {
          this.isNight = !this.isNight;
          if (this.isNight) {
            document.body.classList.add("night-mode");
            this.showToast("🌙 GECE", "Auto x3", "info");
          } else {
            document.body.classList.remove("night-mode");
            this.showToast("☀️ GÜNDÜZ", "Normal", "info");
          }
          this.weatherLoop();
          this.updateUI();
        },
        scheduleBee() {
          setTimeout(() => {
            this.spawnBee();
            this.scheduleBee();
          }, Math.random() * 60000 + 30000);
        },
        spawnBee() {
          if (!this.gameStarted) return;
          const b = document.createElement("div");
          b.innerHTML = "🐝";
          b.className = "bee-moving";
          b.style.top = 10 + Math.random() * 50 + "%";
          b.onclick = (e) => {
            e.stopPropagation();
            b.remove();
            let r = Math.max(
              500,
              Math.floor(
                this.data.autoPower * this.data.prestigeMultiplier * 300
              )
            );
            this.data.points += r;
            audioManager.playDing();
            this.showToast("ARI", `+${r} SP`, "success");
          };
          document.body.appendChild(b);
          setTimeout(() => b.remove(), 15000);
        },
        scheduleGoldenSeed() {
          setTimeout(() => {
            this.showGoldenSeed();
            this.scheduleGoldenSeed();
          }, Math.random() * 40000 + 20000);
        },
        showGoldenSeed() {
          if (!this.gameStarted) return;
          const e = document.getElementById("golden-seed");
          e.style.left = 10 + Math.random() * 80 + "%";
          e.style.top = 10 + Math.random() * 80 + "%";
          e.classList.remove("hidden");
          setTimeout(() => e.classList.add("hidden"), 3000);
        },
        catchGoldenSeed() {
          const e = document.getElementById("golden-seed");
          e.classList.add("hidden");
          const b = Math.max(100, Math.floor(this.data.points * 0.3));
          this.data.points += b;
          audioManager.playDing();
          this.showToast("ALTIN TOHUM", `+${b} SP!`, "success");
          this.updateUI();
        },
      };
      window.onload = () => game.init();
    </script>
  </body>
</html>
